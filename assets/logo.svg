<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="aquaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer Water Droplet / Lab Flask Shape -->
  <path d="M50,10 C25,45 20,70 35,85 C50,100 70,85 65,85 C80,70 75,45 50,10 Z" fill="none" stroke="url(#aquaGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Diagnostic Chart Line inside Drop -->
  <path d="M30,70 L42,50 L58,65 L70,35" fill="none" stroke="url(#emeraldGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  
  <!-- Microscopic Cell / Dotted grid representing particles -->
  <circle cx="30" cy="70" r="3" fill="#00F2FE" />
  <circle cx="42" cy="50" r="3.5" fill="#10B981" />
  <circle cx="58" cy="65" r="3" fill="#00F2FE" />
  <circle cx="70" cy="35" r="4" fill="#10B981" filter="url(#glow)" />
  
  <!-- Secondary circles (Artemia/plankton shape simulation) -->
  <circle cx="50" cy="28" r="2.5" fill="#f3f4f6" opacity="0.8" />
  <circle cx="65" cy="55" r="2" fill="#9ca3af" opacity="0.6" />
</svg>
